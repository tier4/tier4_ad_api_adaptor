notifications:
  /autoware/localization/state:
    priority: 50
    messages:
      - condition: Always
        audiences:
          mot:
            en:
              situation: waiting for the pose initialization
              solution: please initialize the pose
            ja:
              situation: 姿勢の初期化待ち
              solution: 姿勢を初期化してください
          remote:
            en:
              situation: waiting for the pose initialization
              solution: please initialize the pose
            ja:
              situation: 姿勢の初期化待ち
              solution: 姿勢を初期化してください

  /autoware/planning/routing/state:
    priority: 0
    messages:
      - condition: LocalizationState(Initialized)
        audiences:
          mot:
            en:
              situation: waiting for the route
              solution: please set the route
            ja:
              situation: ルート待ち
              solution: ルートを設定してください
          remote:
            en:
              situation: waiting for the route
              solution: please set the route
            ja:
              situation: ルート待ち
              solution: ルートを設定してください

  /autoware/control:
    priority: 100
    messages:
      - condition: RouteState(Set)
        audiences:
          mot:
            en:
              situation: control module error
              solution: please tell the developer the error code
            ja:
              situation: 制御モジュールエラー
              solution: 開発者エラーコードを伝えてください
          remote:
            en:
              situation: control module error
              solution: please tell the developer the error code
            ja:
              situation: 制御モジュールエラー
              solution: 開発者エラーコードを伝えてください
